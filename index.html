<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleShop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 15px;
            margin: 0;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #222222);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            border-radius: 8px;
            background: #ffffff;
            padding: 5px;
        }
        .card h4 {
            font-size: 13px;
            margin: 8px 0 4px 0;
            line-height: 1.2;
        }
        .card p {
            font-size: 13px;
            color: #2481cc;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .card button {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>🛍 HustleShop Mini</h2>
    <div class="grid" id="product-grid"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const products = [
            // --- TELEGRAM STARS ---
            { id: 1, title: 'Telegram Stars (50 ⭐)', price: 490, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },
            { id: 2, title: 'Telegram Stars (100 ⭐)', price: 950, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },
            { id: 3, title: 'Telegram Stars (250 ⭐)', price: 2200, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },
            { id: 4, title: 'Telegram Stars (500 ⭐)', price: 4400, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },
            { id: 5, title: 'Telegram Stars (1000 ⭐)', price: 8700, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },
            { id: 6, title: 'Telegram Stars (2500 ⭐)', price: 21000, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },
            { id: 7, title: 'Telegram Stars (5000 ⭐)', price: 41000, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },

            // --- TELEGRAM PREMIUM ---
            { id: 8, title: 'Telegram Premium (1 мес)', price: 1990, image: 'https://cdn-icons-png.flaticon.com/512/732/732200.png' },
            { id: 9, title: 'Telegram Premium (3 мес)', price: 5500, image: 'https://cdn-icons-png.flaticon.com/512/732/732200.png' },
            { id: 10, title: 'Telegram Premium (6 мес)', price: 9800, image: 'https://cdn-icons-png.flaticon.com/512/732/732200.png' },
            { id: 11, title: 'Telegram Premium (12 мес)', price: 16500, image: 'https://cdn-icons-png.flaticon.com/512/732/732200.png' },

            // --- NFT GIFTS ---
            { id: 12, title: 'Rare Pepe NFT Gift', price: 3900, image: 'https://cdn-icons-png.flaticon.com/512/6229/6229302.png' },
            { id: 13, title: 'Telegram Duck NFT Gift', price: 7900, image: 'https://cdn-icons-png.flaticon.com/512/1046/1046784.png' },
            { id: 14, title: 'Cyber Cat NFT Gift', price: 11900, image: 'https://cdn-icons-png.flaticon.com/512/6229/6229302.png' },
            { id: 15, title: 'Spotted Dog NFT Gift', price: 6500, image: 'https://cdn-icons-png.flaticon.com/512/6229/6229302.png' },
            { id: 16, title: 'TON Diamond NFT', price: 28000, image: 'https://cdn-icons-png.flaticon.com/512/6229/6229302.png' },

            // --- ВИРТУАЛЬНЫЕ НОМЕРА / АККАУНТЫ С ПАРАМЕТРАМИ ---
            { id: 17, title: 'Вирт. номер (Быстрый SMS, Без отлёжки)', price: 650, image: 'https://cdn-icons-png.flaticon.com/512/159/159832.png' },
            { id: 18, title: 'Аккаунт ТГ (С отлёжкой 1+ мес, Чистый)', price: 1500, image: 'https://cdn-icons-png.flaticon.com/512/159/159832.png' },
            { id: 19, title: 'Аккаунт ТГ (С отлёжкой 6+ мес, Без спамблока)', price: 2800, image: 'https://cdn-icons-png.flaticon.com/512/159/159832.png' },
            { id: 20, title: 'Аккаунт ТГ (С отлёжкой + Premium 1 мес)', price: 3800, image: 'https://cdn-icons-png.flaticon.com/512/159/159832.png' },
            { id: 21, title: 'Аккаунт ТГ (С отлёжкой + Premium 12 мес)', price: 18500, image: 'https://cdn-icons-png.flaticon.com/512/159/159832.png' },
            { id: 22, title: 'Анонимный +888 номер (Fragment NFT)', price: 69000, image: 'https://cdn-icons-png.flaticon.com/512/159/159832.png' },

            // --- TON & КРИПТА ---
            { id: 23, title: 'Пополнение TON (5 TON)', price: 9900, image: 'https://cdn-icons-png.flaticon.com/512/6001/6001368.png' },
            { id: 24, title: 'Пополнение TON (10 TON)', price: 19500, image: 'https://cdn-icons-png.flaticon.com/512/6001/6001368.png' }
        ];

        const grid = document.getElementById('product-grid');

        products.forEach(p => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${p.image}" alt="${p.title}">
                <h4>${p.title}</h4>
                <p>${p.price} ₸</p>
                <button onclick="buy(${p.id})">Купить</button>
            `;
            grid.appendChild(card);
        });

        function buy(id) {
            let product = products.find(p => p.id === id);
            tg.sendData(JSON.stringify(product));
            tg.close();
        }
    </script>
</body>
</html>
