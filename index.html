<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleShop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 15px;
            margin: 0;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #222222);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            border-radius: 8px;
            background: #ffffff;
            padding: 5px;
        }
        .card h4 {
            font-size: 14px;
            margin: 8px 0 4px 0;
        }
        .card p {
            font-size: 13px;
            color: #a0a0a0;
            margin: 0 0 10px 0;
        }
        .card button {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>🛍 HustleShop Mini</h2>
    <div class="grid" id="product-grid"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const products = [
            { id: 1, title: 'Telegram Stars (500 ⭐)', price: 5200, image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png' },
            { id: 2, title: 'Telegram Premium (1 мес)', price: 2500, image: 'https://cdn-icons-png.flaticon.com/512/732/732200.png' },
            { id: 3, title: 'Rare Pepe NFT Gift', price: 5000, image: 'https://cdn-icons-png.flaticon.com/512/6229/6229302.png' },
            { id: 4, title: 'Telegram Duck NFT Gift', price: 10000, image: 'https://cdn-icons-png.flaticon.com/512/1046/1046784.png' },
            { id: 5, title: 'Виртуальный номер', price: 1500, image: 'https://cdn-icons-png.flaticon.com/512/159/159832.png' }
        ];

        const grid = document.getElementById('product-grid');

        products.forEach(p => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${p.image}" alt="${p.title}">
                <h4>${p.title}</h4>
                <p>${p.price} ₸</p>
                <button onclick="buy(${p.id})">Купить</button>
            `;
            grid.appendChild(card);
        });

        function buy(id) {
            let product = products.find(p => p.id === id);
            tg.sendData(JSON.stringify(product));
            tg.close();
        }
    </script>
</body>
</html>
