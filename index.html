<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleShop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121316;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
        }
        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #f59e0b, #eab308);
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
        }

        /* Главный баннер */
        .hero {
            text-align: center;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .hero h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .hero h1 span {
            background: linear-gradient(90deg, #fef08a, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.4;
        }

        /* Статистика */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1c1e24;
            border: 1px solid #2d313e;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .stat-card .num {
            font-weight: 700;
            font-size: 15px;
            color: #fef08a;
        }
        .stat-card .label {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }

        /* Переключатель категорий */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .cat-btn {
            background: #1c1e24;
            border: 1px solid #2d313e;
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active {
            background: #eab308;
            color: #000000;
            border-color: #eab308;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
        }

        /* Поле ввода для Stars */
        .custom-input-box {
            background: #1c1e24;
            border: 1px solid #2d313e;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        .custom-input-box h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .input-field {
            width: 100%;
            background: #121316;
            border: 1px solid #2d313e;
            border-radius: 12px;
            padding: 12px;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }
        .input-field:focus {
            border-color: #eab308;
        }
        .main-btn {
            width: 100%;
            background: #eab308;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.3);
        }

        /* Сетка товаров */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .card {
            background: #1c1e24;
            border: 1px solid #2d313e;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #eab308;
            color: #000000;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 8px;
            text-transform: uppercase;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .card-price {
            font-size: 15px;
            font-weight: 800;
            color: #fef08a;
            margin-bottom: 10px;
        }
        .card-btn {
            background: #2b2f3e;
            color: #ffffff;
            border: 1px solid #3d4358;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-btn:active {
            background: #eab308;
            color: #000000;
        }

        /* Нижнее меню */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(28, 30, 36, 0.95);
            border-top: 1px solid #2d313e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            color: #6b7280;
            font-size: 10px;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active {
            color: #fef08a;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="brand">
            <div class="avatar">H</div>
            <span>HustleShop</span>
        </div>
    </div>

    <!-- Заголовок -->
    <div class="hero">
        <div class="badge">★ Мгновенная доставка</div>
        <h1>Купить<br><span>Telegram Goods</span></h1>
        <p>Лучшие цены, быстрая автоматическая выдача. Оплата Kaspi — комиссия 0%</p>
    </div>

    <!-- Статистика -->
    <div class="stats">
        <div class="stat-card">
            <div class="num">10K+</div>
            <div class="label">Клиентов</div>
        </div>
        <div class="stat-card">
            <div class="num">0%</div>
            <div class="label">Комиссия</div>
        </div>
        <div class="stat-card">
            <div class="num">&lt;1 min</div>
            <div class="label">Доставка</div>
        </div>
    </div>

    <!-- Категории -->
    <div class="categories">
        <button class="cat-btn active" onclick="filterCat('stars')">★ Stars</button>
        <button class="cat-btn" onclick="filterCat('premium')">💎 Premium</button>
        <button class="cat-btn" onclick="filterCat('gifts')">🎁 Подарки</button>
        <button class="cat-btn" onclick="filterCat('numbers')">📱 Номера</button>
    </div>

    <!-- Ввод Stars -->
    <div id="stars-custom-box" class="custom-input-box">
        <h3>Введите сумму ★</h3>
        <input type="number" id="custom-stars" class="input-field" placeholder="50 - 20000" min="50" max="20000">
        <button class="main-btn" onclick="buyCustomStars()">Купить</button>
    </div>

    <!-- Сетка -->
    <div class="section-title" id="section-title">Популярные пакеты</div>
    <div class="grid" id="product-grid"></div>

    <!-- Нижнее меню -->
    <div class="nav-bar">
        <div class="nav-item">
            <span class="nav-icon">📊</span>
            <span>Статистика</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📱</span>
            <span>Номера</span>
        </div>
        <div class="nav-item active">
            <span class="nav-icon">🛍️</span>
            <span>Магазин</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const allProducts = {
            stars: [
                { id: 1, title: '50 ★', price: '490 ₸', rawPrice: 490, badge: '' },
                { id: 2, title: '100 ★', price: '950 ₸', rawPrice: 950, badge: 'ХИТ' },
                { id: 3, title: '250 ★', price: '2 200 ₸', rawPrice: 2200, badge: '' },
                { id: 4, title: '500 ★', price: '4 400 ₸', rawPrice: 4400, badge: '' },
                { id: 5, title: '1000 ★', price: '8 700 ₸', rawPrice: 8700, badge: 'ВЫГОДА' },
                { id: 6, title: '2500 ★', price: '21 000 ₸', rawPrice: 21000, badge: '' }
            ],
            premium: [
                { id: 8, title: '3 мес 💎', price: '6 200 ₸', rawPrice: 6200, badge: 'ХИТ' },
                { id: 9, title: '6 мес 💎', price: '8 300 ₸', rawPrice: 8300, badge: '' },
                { id: 10, title: '12 мес 💎', price: '15 200 ₸', rawPrice: 15200, badge: 'ТОП' }
            ],
            gifts: [
                { id: 12, title: 'Pepe NFT 🐸', price: '3 900 ₸', rawPrice: 3900, badge: '' },
                { id: 13, title: 'Duck NFT 🦆', price: '7 900 ₸', rawPrice: 7900, badge: 'ХИТ' },
                { id: 14, title: 'Cyber Cat 🐱', price: '11 900 ₸', rawPrice: 11900, badge: '' },
                { id: 15, title: 'TON Diamond 🔷', price: '28 000 ₸', rawPrice: 28000, badge: 'RARE' }
            ],
            numbers: [
                { id: 17, title: 'Вирт. номер', price: '650 ₸', rawPrice: 650, badge: 'БЫСТРО' },
                { id: 18, title: 'Отлёжка 1+ мес', price: '1 500 ₸', rawPrice: 1500, badge: 'ЧИСТЫЙ' },
                { id: 19, title: 'Без спамблока', price: '2 800 ₸', rawPrice: 2800, badge: 'ТОП' },
                { id: 20, title: 'Номер + Premium', price: '3 800 ₸', rawPrice: 3800, badge: 'ХИТ' }
            ]
        };

        let currentCat = 'stars';

        function renderProducts(cat) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            allProducts[cat].forEach(p => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${p.badge ? `<div class="card-badge">${p.badge}</div>` : ''}
                    <div class="card-title">${p.title}</div>
                    <div class="card-price">${p.price}</div>
                    <button class="card-btn" onclick="buyItem('${p.title}', ${p.rawPrice})">Купить</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const starsBox = document.getElementById('stars-custom-box');
            if (cat === 'stars') {
                starsBox.style.display = 'block';
            } else {
                starsBox.style.display = 'none';
            }

            renderProducts(cat);
        }

        function buyCustomStars() {
            let count = document.getElementById('custom-stars').value;
            if (!count || count < 50) {
                alert('Минимальное количество — 50 Stars');
                return;
            }
            let price = Math.round(count * 9.5);
            tg.sendData(JSON.stringify({ title: `${count} Stars (Произвольно)`, price: price }));
            tg.close();
        }

        function buyItem(title, price) {
            tg.sendData(JSON.stringify({ title: title, price: price }));
            tg.close();
        }

        renderProducts('stars');
    </script>
</body>
</html>
